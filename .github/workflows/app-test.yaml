name: App / Test

on:
  push:
    branches:
      - main
      - release-*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: Run test task, with coverage
        run: ./gradlew test koverHtmlReport
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: coverage
          retention-days: 14
          path: build/reports/kover/html/
      - name: Compare screenshots with the approved ones
        run: ./gradlew verifyRoborazziDebug --tests '*ScreenshotTest'
      - name: Upload screenshot comparisons
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: screenshot-comparisons
          retention-days: 14
          path: '*/build/outputs/roborazzi/'
