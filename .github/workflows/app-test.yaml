name: App / Test

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
  schedule:
    # Weekly, every Jellyfin version the apps support, so a break in an older one shows up too.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # "pinned" is test-server/docker-compose.yml's default (Renovate bumps it), the only version PRs
    # test, and keeps the plain "Test" name that checks refer to.
    name: ${{ matrix.jellyfin == 'pinned' && 'Test' || format('Test (Jellyfin {0})', matrix.jellyfin) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Weekly (or by hand): the oldest supported release (10.10.7; 10.10.0 has a playlist bug), the
        # first and last 10.11 (its patches changed tag filtering and artist names), the first 12.x
        # (which dropped the api_key token), and latest, for a release Renovate hasn't proposed yet.
        jellyfin: ${{ fromJSON(contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && '["pinned", "10.10.7", "10.11.0", "10.11.11", "12.0", "latest"]' || '["pinned"]') }}
    env:
      # Empty for pinned, so the test server uses its default.
      JELLYFIN_VERSION: ${{ matrix.jellyfin != 'pinned' && matrix.jellyfin || '' }}
      VAULT_TEST_HOSTNAME: http://localhost:8097
      VAULT_TEST_USERNAME: vault-test
      VAULT_TEST_PASSWORD: vault-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: Restore generated test media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-server/.data/media
          key: test-server-media-${{ hashFiles('test-server/fixtures.json', 'test-server/generate_media.py') }}
      # The downloaded EPUBs, cached apart from the media and restored from any older entry, so a
      # fixtures change doesn't make every run fetch them from gutenberg.org again.
      - name: Restore downloaded test books
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-server/.data/downloads
          key: test-server-downloads-${{ hashFiles('test-server/fixtures.json') }}
          restore-keys: test-server-downloads-
      - name: Start the test server (Jellyfin ${{ matrix.jellyfin }})
        run: test-server/up.sh
      - name: Run test task, with coverage
        if: ${{ matrix.jellyfin == 'pinned' }}
        run: ./gradlew test koverHtmlReport
      - name: Run the server tests
        if: ${{ matrix.jellyfin != 'pinned' }}
        run: >-
          ./gradlew --continue
          :common:testDebugUnitTest --tests '*ContractTest'
          :app-audiovault:testDebugUnitTest --tests '*ContractTest'
          :app-bookvault:testDebugUnitTest --tests '*ContractTest'
          :app-livevault:testDebugUnitTest --tests '*ContractTest'
          :app-tunevault:testDebugUnitTest --tests '*ContractTest'
      - name: Save the test server's logs
        if: ${{ failure() }}
        run: docker compose -f test-server/docker-compose.yml logs --no-color > test-server-logs.txt
      - name: Upload the test server's logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: test-server-logs-${{ matrix.jellyfin }}
          retention-days: 14
          path: test-server-logs.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && matrix.jellyfin == 'pinned' }}
        with:
          name: coverage
          retention-days: 14
          path: build/reports/kover/html/
      - name: Compare screenshots with the approved ones
        if: ${{ matrix.jellyfin == 'pinned' }}
        run: ./gradlew verifyRoborazziDebug --tests '*ScreenshotTest'
      - name: Upload screenshot comparisons
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() && matrix.jellyfin == 'pinned' }}
        with:
          name: screenshot-comparisons
          retention-days: 14
          path: '*/build/outputs/roborazzi/'
